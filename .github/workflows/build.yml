name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза, например v2.1 (пусто — просто собрать)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt setuptools
      - run: python setup.py build_apps
      - uses: actions/upload-artifact@v4
        with:
          name: FartTogether-windows
          path: build/win_amd64
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        run: cd build && mv win_amd64 FartTogether && zip -qr ../FartTogether-windows.zip FartTogether
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: FartTogether-windows.zip
          generate_release_notes: true
